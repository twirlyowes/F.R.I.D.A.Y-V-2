name: AssetForge Security Checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/assetforge-command

permissions:
  contents: read

jobs:
  assetforge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check syntax
        run: |
          node --check assetforge.js
          node --check index.js
          node --check help.js
      - name: Run automated tests
        run: npm test
